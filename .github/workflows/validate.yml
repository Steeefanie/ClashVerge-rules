name: validate

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 离线重建并校验
        run: python tools/build.py --check
      - name: 单元测试
        run: python -m unittest discover -s tools -p "test_*.py" -v
