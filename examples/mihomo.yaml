rules:
  # ② 本地域名规则（QX [filter_local]）
  - 'DOMAIN,ad.12306.cn,DIRECT'
  - 'DOMAIN,gg.caixin.com,DIRECT'
  - 'DOMAIN,sdkapp.uve.weibo.com,DIRECT'
  - 'DOMAIN-SUFFIX,githubusercontent.com,Global'
  - 'DOMAIN-SUFFIX,github.com,Global'
  # ③ 域名规则集，按 QX [filter_remote] 顺序（keyword 紧跟所属来源）
  - 'RULE-SET,advertising,广告拦截'
  - 'RULE-SET,openai,OpenAI'
  - 'RULE-SET,anthropic,Anthropic'
  - 'RULE-SET,google-gemini,Gemini'
  - 'RULE-SET,google-youtube,YouTube'
  - 'RULE-SET,google-without-youtube,Google'
  - 'RULE-SET,microsoft-onedrive-web,OneDrive-Web'
  - 'RULE-SET,microsoft-onedrive-sync,OneDrive-Sync'
  - 'RULE-SET,microsoft-github,GitHub'
  - 'RULE-SET,microsoft,Microsoft'
  - 'RULE-SET,spotify,Spotify'
  - 'RULE-SET,spotify_keyword,Spotify'
  - 'RULE-SET,bytedance-tiktok,TikTok'
  - 'RULE-SET,netflix,Netflix'
  - 'RULE-SET,disney,Disney'
  - 'RULE-SET,steam,Steam'
  - 'RULE-SET,telegram,Telegram'
  - 'RULE-SET,twitter,X'
  - 'RULE-SET,meta,Meta'
  - 'RULE-SET,wikimedia,Wiki'
  - 'RULE-SET,linkedin,LinkedIn'
  - 'RULE-SET,bilibili,国内服务'
  - 'RULE-SET,xiaohongshu,国内服务'
  - 'RULE-SET,deepseek,国内服务'
  - 'RULE-SET,tencent,国内服务'
  - 'RULE-SET,apple,Apple'
  - 'RULE-SET,domestic,DIRECT'
  - 'RULE-SET,global,Global'
  # ④ 本地 IP 规则与 GeoIP（放在全部域名规则之后；这一层会触发 DNS 解析）
  - 'IP-CIDR,180.76.76.200/32,REJECT'
  - 'IP-CIDR,203.107.1.1/24,REJECT'
  - 'IP-CIDR,10.0.0.0/8,DIRECT'
  - 'IP-CIDR,127.0.0.0/8,DIRECT'
  - 'IP-CIDR,169.254.0.0/16,DIRECT'
  - 'IP-CIDR,172.16.0.0/12,DIRECT'
  - 'IP-CIDR,192.168.0.0/16,DIRECT'
  - 'IP-CIDR,224.0.0.0/24,DIRECT'
  - 'IP-CIDR,182.254.116.0/24,DIRECT'
  - 'IP-CIDR6,::1/128,DIRECT'
  - 'IP-CIDR6,fc00::/7,DIRECT'
  - 'IP-CIDR6,fe80::/10,DIRECT'
  - 'GEOIP,CN,DIRECT'
  # ⑤ 规则集中的 IP 条件
  - 'RULE-SET,spotify_ip,Spotify'
  # ⑥ 兜底
  - 'MATCH,Global'
