# ClashVerge-rules 完整配置模板（Mihomo / Clash Verge Rev）
# 规则来源：https://github.com/Steeefanie/QuantumultX-resources @ 33b22e9fc24f；由 tools/build.py 生成，请勿手改
# 使用前把 proxy-providers.airport.url 替换为你自己的订阅地址（不要提交真实地址）。
# 匹配模型：order（见 README「匹配模型」）。地区组没有匹配节点时走 REJECT，不会静默直连。
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*.lan', '*.local', '*.arpa', 'time.*.com', 'ntp.*.com', '+.market.xiaomi.com', 'localhost.ptlogin2.qq.com', '*.msftncsi.com', 'www.msftconnecttest.com']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
  proxy-server-nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']

proxy-providers:
  airport:
    type: http
    url: 'https://example.com/your-subscription-url'  # ← 替换为你的订阅地址
    path: ./proxy_providers/airport.yaml
    interval: 86400
    health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 600}

proxy-groups:
  - {name: Global, type: select, proxies: ['Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Hong Kong', type: url-test, use: [airport], filter: '(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:香港|hong[ _-]?kong|🇭🇰|(?<![a-z])hk(?![a-z])).*$', empty-fallback: REJECT, url: 'https://www.gstatic.com/generate_204', interval: 600, tolerance: 20, lazy: true}
  - {name: 'Taiwan', type: url-test, use: [airport], filter: '(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:台湾|台灣|台北|臺北|台中|新北|高雄|彰化|hinet|cht|taiwan|taipei|🇹🇼|(?<![a-z])tw(?![a-z])).*$', empty-fallback: REJECT, url: 'https://www.gstatic.com/generate_204', interval: 600, tolerance: 20, lazy: true}
  - {name: 'Japan', type: url-test, use: [airport], filter: '(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:日本|东京|東京|大阪|japan|tokyo|osaka|🇯🇵|(?<![a-z])jp(?![a-z])).*$', empty-fallback: REJECT, url: 'https://www.gstatic.com/generate_204', interval: 600, tolerance: 20, lazy: true}
  - {name: 'Singapore', type: url-test, use: [airport], filter: '(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:新加坡|狮城|獅城|singapore|🇸🇬|(?<![a-z])sg(?![a-z])).*$', empty-fallback: REJECT, url: 'https://www.gstatic.com/generate_204', interval: 600, tolerance: 20, lazy: true}
  - {name: 'United States', type: url-test, use: [airport], filter: '(?i)^(?!.*(?:流量|到期|剩余|重置|套餐|公告|traffic|expire|reset|quota|balance|(?<![a-z])beta(?![a-z]))).*(?:美国|美國|洛杉矶|洛杉磯|圣何塞|聖荷西|西雅图|西雅圖|纽约|紐約|united[ _-]?states|american?|los[ _-]?angeles|san[ _-]?jose|seattle|new[ _-]?york|🇺🇸|(?<![a-z])us(?![a-z])).*$', empty-fallback: REJECT, url: 'https://www.gstatic.com/generate_204', interval: 600, tolerance: 20, lazy: true}
  - {name: '广告拦截', type: select, proxies: ['REJECT', 'DIRECT']}
  - {name: 'OpenAI', type: select, proxies: ['United States', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'DIRECT']}
  - {name: 'Anthropic', type: select, proxies: ['United States', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'DIRECT']}
  - {name: 'Gemini', type: select, proxies: ['United States', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'DIRECT']}
  - {name: 'YouTube', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Google', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'OneDrive-Web', type: select, proxies: ['Hong Kong', 'Global', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'OneDrive-Sync', type: select, proxies: ['DIRECT', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States']}
  - {name: 'GitHub', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Microsoft', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Spotify', type: select, proxies: ['United States', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'DIRECT']}
  - {name: 'TikTok', type: select, proxies: ['Singapore', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'United States', 'DIRECT']}
  - {name: 'Netflix', type: select, proxies: ['Singapore', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'United States', 'DIRECT']}
  - {name: 'Disney', type: select, proxies: ['Singapore', 'Global', 'Hong Kong', 'Taiwan', 'Japan', 'United States', 'DIRECT']}
  - {name: 'Steam', type: select, proxies: ['Hong Kong', 'Global', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Telegram', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'X', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
  - {name: 'Meta', type: select, proxies: ['Global', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States', 'DIRECT']}
